version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: organicstore_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-organicstore}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network
    ports:
      - "3306:3306"

  # WordPress with PHP 8.3
  wordpress:
    image: wordpress:php8.3-apache
    container_name: organicstore_wordpress
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-organicstore}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME:-http://organicstore.local}');
        define('WP_SITEURL', '${WP_SITEURL:-http://organicstore.local}');
    volumes:
      # Mount the entire project root to WordPress root
      - ./:/var/www/html
      # PHP custom configuration for performance
      - ./.docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      # Apache configuration (if needed)
      # - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    networks:
      - wordpress_network
    ports:
      - "80:80"

  # WP-CLI service
  wpcli:
    image: wordpress:cli-php8.3
    container_name: organicstore_wpcli
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-organicstore}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - ./:/var/www/html
    networks:
      - wordpress_network
    user: "33:33"  # www-data user
    entrypoint: wp
    command: "--info"

volumes:
  db_data:
    driver: local

networks:
  wordpress_network:
    driver: bridge
